name: 'dbt_radar'
version: '2.0.0'
profile: 'dbt_radar'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Competências comparadas pelo diff. Sobrescreva com --vars na execução.
  competencia_atual: '2026-08'
  competencia_anterior: '2026-07'
  # ICP ativo (arquivo em config/icp/<nome>.yaml, carregado como seed).
  icp_ativo: 'contabilidade_sul_mg'
  # Janela de recência considerada para a pontuação.
  janela_recencia_dias: 45

models:
  dbt_radar:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

seeds:
  dbt_radar:
    +schema: config
