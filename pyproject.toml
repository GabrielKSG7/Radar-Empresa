[project]
name = "radar-b2b"
version = "2.0.0"
description = "Motor de eventos e oportunidades B2B sobre a base pública de CNPJ"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]

[project.optional-dependencies]
ia = ["google-genai>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
