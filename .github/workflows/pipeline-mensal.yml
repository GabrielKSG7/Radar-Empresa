# Execução recorrente (Fase 9 — Automação).
# A Receita publica a base mensalmente; rodamos alguns dias depois.
name: Pipeline mensal

on:
  schedule:
    - cron: '0 9 5 * *'      # dia 5 de cada mês, 09:00 UTC
  workflow_dispatch:
    inputs:
      competencia:
        description: 'Competência AAAA-MM (vazio = mês atual)'
        required: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[ia]"
      - name: Rodar pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_pipeline.py --uf MG \
            ${{ inputs.competencia && format('--competencia {0}', inputs.competencia) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-mensal
          path: data/digests/*.md
